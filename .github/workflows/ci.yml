# Every push: the identity of every new commit (same rule as .githooks), the
# profile README unchanged from its pinned hash (brand.lock, written only by
# the release), and every commit and tag after the boundary dated at the
# publication time, 06:17:00 UTC (same rule as .githooks/pre-push).
name: CI
on: push
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false  # no later step needs a git credential
      - name: Every pushed commit has the Nox FZE identity
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE" 2>/dev/null; then range="$AFTER"; else range="$BEFORE..$AFTER"; fi
          bash .githooks/identity-guard.sh range "$range"
      - name: Profile README matches its pinned hash
        run: sha256sum --check --strict brand.lock
      - name: Every commit and tag after v2.1.0 is dated at the publication time, 06:17:00 UTC
        env:
          BOUNDARY: 8594bca29a34f629f5f14566d340ce33a0f3ab85
          BOUNDARY_TAGGED: 1790943215
        run: |
          git cat-file -e "$BOUNDARY^{commit}" || { echo "::error::boundary $BOUNDARY is missing"; exit 1; }
          bad=0
          ok() { [[ $1 =~ ^[0-9]+$ ]] && (( $1 % 86400 == 22620 )) && [[ $2 == +0000 ]]; }
          while read -r sha a az c cz; do
            ok "$a" "$az" && ok "$c" "$cz" || { echo "::error::$sha is not dated at a publication time"; bad=1; }
          done < <(git log --format='%H %ad %cd' --date=raw "$BOUNDARY..HEAD")
          while read -r tag t tz; do
            git merge-base --is-ancestor "$tag^{commit}" "$BOUNDARY" && [[ $t =~ ^[0-9]+$ ]] && (( t <= BOUNDARY_TAGGED )) && continue
            ok "$t" "$tz" || { echo "::error::tag $tag is not dated at a publication time"; bad=1; }
          done < <(git for-each-ref --format='%(refname:short) %(taggerdate:raw)' refs/tags)
          exit "$bad"
