# Every push: the identity of every new commit (same rule as .githooks), and
# the profile README unchanged from its pinned hash (brand.lock, written only
# by the release).
name: CI
on: push
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false  # no later step needs a git credential
      - name: Every pushed commit has the Nox FZE identity
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE" 2>/dev/null; then range="$AFTER"; else range="$BEFORE..$AFTER"; fi
          bash .githooks/identity-guard.sh range "$range"
      - name: Profile README matches its pinned hash
        run: sha256sum --check --strict brand.lock
